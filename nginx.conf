server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Clean URLs: /discord/system → /discord/system/index.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;

    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    location /shots/  { expires 7d; add_header Cache-Control "public"; }
    location = /search.json { add_header Cache-Control "no-cache"; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
