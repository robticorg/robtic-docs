name: Build and deploy

# Every push / PR: build the site with checks (missing pages, images, broken links fail the build).
# Push to main: build ghcr.io/robticorg/robtic-docs (:production + :sha-…, PRIVATE), then redeploy the robtic-docs
# Portainer stack through its webhook (secret ROBTIC_DOCS_PORTAINER_WEBHOOK_URL), from the runner on the server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun build.ts --check

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robticorg/robtic-docs
          tags: |
            type=raw,value=production
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    needs: image
    runs-on: [self-hosted, robtic-deploy]
    timeout-minutes: 10
    steps:
      - name: Call the Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.ROBTIC_DOCS_PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::ROBTIC_DOCS_PORTAINER_WEBHOOK_URL is not set — image pushed, nothing redeployed."
            exit 0
          fi
          curl --fail-with-body -sSk -X POST --max-time 300 "$WEBHOOK"
